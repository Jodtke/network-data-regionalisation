# GISCO download config
# Use null to skip optional paths.

# Output directory for generated shapes
out_dir: "./shapes"

# GISCO dataset options
year: 2024
scale: "10M"  # one of: 01M, 03M, 10M, 20M, 60M
epsg: 3035

# Optional country map override (CSV with columns: iso3, iso2)
country_map_csv: null

# Optional reductions CSV (country_code,country_label,member_countries)
reductions_csv: "country_reductions.csv"

# Northern Ireland handling
include_northern_ireland: false
# Provide one NI source when enabled (preferred: NUTS3).
ni_nuts3_geojson: null
ni_nuts3_field: "index"
ni_nuts3_prefix: "UKN"

# Kosovo handling (optional)
include_kosovo: false
kosovo_source: null
kosovo_field: null
kosovo_value: null
kosovo_subtract_from: "RS"

# Output filenames
countries_out: "country_shapes.geojson"
europe_out: "europe_shape.geojson"
reductions_out: "country_reductions.geojson"
