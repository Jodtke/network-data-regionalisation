# Template config for compute_profiles.py (all parameters).
# Use null to omit optional values. Empty lists are ignored.
# Allowed values are documented inline.

# Year range (inclusive).
start_year: 2013
end_year: 2013
# Input cutout directory and output directory.
cutout_dir: '\\IIP-COMP103\\endata\\MA_Lisa\\atlite_cutouts\\cutouts'
out_dir: '\\IIP-COMP103\\endata\\MA_Eric'

# Resources: list of pv|onwind|offwind|hydro|all.
resources:
  - all

# Mask toggles.
mask_onshore: false
mask_offshore: false
# Use high-resolution ExclusionContainer masks (res in meters).
use_excluder_mask: false
excluder_res_onshore: 100.0
excluder_res_offshore: 200.0

# Mask/region inputs.
# Mask shapes are intersected (all must be true).
onshore_mask_shapes:
  - 'Y:\Group_SEM\MA_Eric\Dissertation\pypsa\opf\datashapes\europe_shape.geojson'
offshore_mask_shapes:
  - 'Y:\Group_SEM\MA_Eric\Dissertation\pypsa\opf\datashapes\eez_offshore_eu27_uk_no_europe_only.geojson'
# Regions are used for availability_mode=regions and per-region resource classes.
onshore_regions: 'Y:\Group_SEM\MA_Eric\Dissertation\pypsa\opf\datashapes\regions_onshore.geojson'
offshore_regions: 'Y:\Group_SEM\MA_Eric\Dissertation\pypsa\opf\datashapes\eez_offshore_eu27_uk_no_europe_only.geojson'
country_shapes: 'Y:\Group_SEM\MA_Eric\Dissertation\pypsa\opf\datashapes\country_shapes.geojson'
# Optional hydro aggregation reductions (e.g. A2/A3/A4 groups); only used for hydro.
hydro_reductions_path: 'Y:\Group_SEM\MA_Eric\Dissertation\pypsa\opf\datashapes\country_reductions.geojson'
# Deprecated (use onshore_mask_shapes/offshore_mask_shapes + onshore_regions/offshore_regions):
# onshore_shapes: null
# offshore_shapes: null

# Natura2000 mask.
exclude_natura: false
natura_path: 'Y:\Group_SEM\MA_Eric\Dissertation\pypsa\opf\datashapes\natura.tiff'

# Ship density mask (offshore).
exclude_shipdensity: false
shipdensity_path: 'Y:\Group_SEM\MA_Eric\Dissertation\pypsa\opf\datashapes\shipdensity_raster.nc'
shipdensity_threshold: null

# WDPA mask (offshore + optional onshore strict).
exclude_wdpa_offshore: false
exclude_wdpa_onshore: false
wdpa_polygons:
  - 'Y:\Group_SEM\MA_Eric\Dissertation\pypsa\opf\datashapes\WDPA_WDOECM_Aug2025_Public_EU_shp_0\WDPA_WDOECM_Aug2025_Public_EU_shp-polygons.shp'
  - 'Y:\Group_SEM\MA_Eric\Dissertation\pypsa\opf\datashapes\WDPA_WDOECM_Aug2025_Public_EU_shp_1\WDPA_WDOECM_Aug2025_Public_EU_shp-polygons.shp'
  - 'Y:\Group_SEM\MA_Eric\Dissertation\pypsa\opf\datashapes\WDPA_WDOECM_Aug2025_Public_EU_shp_2\WDPA_WDOECM_Aug2025_Public_EU_shp-polygons.shp'
wdpa_points:
  - 'Y:\Group_SEM\MA_Eric\Dissertation\pypsa\opf\datashapes\WDPA_WDOECM_Aug2025_Public_EU_shp_0\WDPA_WDOECM_Aug2025_Public_EU_shp-points.shp'
  - 'Y:\Group_SEM\MA_Eric\Dissertation\pypsa\opf\datashapes\WDPA_WDOECM_Aug2025_Public_EU_shp_1\WDPA_WDOECM_Aug2025_Public_EU_shp-points.shp'
  - 'Y:\Group_SEM\MA_Eric\Dissertation\pypsa\opf\datashapes\WDPA_WDOECM_Aug2025_Public_EU_shp_2\WDPA_WDOECM_Aug2025_Public_EU_shp-points.shp'
# wdpa_filter: marine|all (marine filters by MARINE>0).
wdpa_filter: marine
# Buffer for WDPA points (meters in EPSG:3035).
wdpa_point_buffer_m: 1000.0
# Optional WDPA attribute filters (list of values). Empty list -> no filter.
wdpa_iucn_include: []
wdpa_iucn_exclude: []
wdpa_status_include: []
wdpa_status_exclude: []
wdpa_designation_include: []
wdpa_designation_exclude: []
wdpa_designation_type_include: []
wdpa_designation_type_exclude: []

# Landuse datasets: corine|luisa|both.
landuse_dataset: corine
# When landuse_dataset=both: intersection|prefer-corine|prefer-luisa.
landuse_fusion: prefer-luisa

# CORINE landcover masks (3-digit codes or raster classes).
corine_landcover_path: 'Y:\Group_SEM\MA_Eric\Dissertation\pypsa\opf\datashapes\CORINE_LANDCOVER_U2018_CLC2018_V2020_20u1.tif'
landcover_include: []
landcover_exclude: []
landcover_include_pv: []
landcover_exclude_pv: []
landcover_include_onwind: []
landcover_exclude_onwind: []

# LUISA landuse masks (4-digit codes).
luisa_landcover_path: 'Y:\Group_SEM\MA_Eric\Dissertation\pypsa\opf\datashapes\LUISA_basemap_020321_100m.tif'
luisa_legend: 'Y:\Group_SEM\MA_Eric\Dissertation\pypsa\opf\datashapes\Legend_Base_Map_2018.csv'
luisa_include: []
luisa_exclude: []
luisa_include_pv: []
luisa_exclude_pv: []
luisa_include_onwind: []
luisa_exclude_onwind: []

# Offshore bathymetry and shore distance masks (meters; positive numbers).
gebco_path: 'Y:\Group_SEM\MA_Eric\Dissertation\pypsa\opf\datashapes\GEBCO_2025.nc'
min_depth: null
max_depth: null
min_shore_distance: null
max_shore_distance: null
# Urban distance mask for onshore wind (meters).
urban_distance_onwind: null

# Availability outputs: raster|regions.
availability_mode: raster
# Resource classes (bins).
resource_classes: 1
# resource_class_mode: global|per-region (per-region requires availability_mode=regions).
resource_class_mode: global
# Year used to compute resource classes; null -> start_year.
resource_class_year: null
# Clip CF values below this threshold to zero (PV/onwind/offwind CFs).
clip_p_max_pu: null

# Capacity densities (MW/km^2).
capacity_per_sqkm_pv: 5.1
capacity_per_sqkm_onwind: 3.0
capacity_per_sqkm_offwind: 2.0

# Technology selection (atlite resource IDs; use "oedb:<name>" to fetch from OEDB).
onwind_turbine: 'Vestas_V112_3MW'
offwind_turbine: 'Vestas_V164_7MW_offshore'
# Technology defaults (PV panel is hardcoded in compute_profiles.py):
#   PV panel = CSi
# Available PV panels (atlite.resource.solarpanels):
#   CdTe, CSi, KANENA
# Available wind turbines (atlite.resource.windturbines):
#   Bonus_B1000_1000kW, Enercon_E101_3000kW, Enercon_E126_7500kW, Enercon_E82_3000kW,
#   NREL_ReferenceTurbine_2016CACost_10MW_offshore, NREL_ReferenceTurbine_2016CACost_6MW_offshore,
#   NREL_ReferenceTurbine_2016CACost_8MW_offshore, NREL_ReferenceTurbine_2019ORCost_12MW_offshore,
#   NREL_ReferenceTurbine_2019ORCost_15MW_offshore, NREL_ReferenceTurbine_2020ATB_12MW_offshore,
#   NREL_ReferenceTurbine_2020ATB_15MW_offshore, NREL_ReferenceTurbine_2020ATB_18MW_offshore,
#   NREL_ReferenceTurbine_2020ATB_4MW, NREL_ReferenceTurbine_2020ATB_5.5MW, NREL_ReferenceTurbine_2020ATB_7MW,
#   NREL_ReferenceTurbine_5MW_offshore, Siemens_SWT_107_3600kW, Siemens_SWT_2300kW, Suzlon_S82_1.5_MW,
#   Vestas_V112_3MW, Vestas_V112_3MW_offshore, Vestas_V164_7MW_offshore, Vestas_V25_200kW,
#   Vestas_V47_660kW, Vestas_V66_1750kW, Vestas_V80_2MW_gridstreamer, Vestas_V90_3MW

# PyPSA-style defaults.
pypsa_defaults: false
# Offwind variant: ac|dc|acdc|float.
pypsa_offwind_variant: acdc

# Hydro normalization.
hydro_normalize: false
hydro_normalize_year: 2013
hydro_reference: 'Y:\Group_SEM\MA_Eric\Dissertation\pypsa\opf\renewables\hydro\hydro_country_profiles.nc'
# Optional bus-level hydro output in addition to country/reduction profiles.
hydro_write_bus_profiles: false

# Only write availability/mask outputs (skip CF/hydro).
masks_out_only: false
# Overwrite outputs if they already exist.
overwrite: false
