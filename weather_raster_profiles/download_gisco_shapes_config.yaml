# GISCO download config (filled example)

out_dir: "./shapes"
year: 2024
scale: "10M"
epsg: 3035

# Optional override (CSV with columns: iso3, iso2)
country_map_csv: null

# Aggregated country groups
reductions_csv: "country_reductions.csv"

# Northern Ireland handling
include_northern_ireland: true
ni_nuts3_geojson: "nuts3_shapes_pop2021_gdp2024.geojson"
ni_nuts3_field: "index"
ni_nuts3_prefix: "UKN"

include_kosovo: false
kosovo_source: null
kosovo_field: null
kosovo_value: null
kosovo_subtract_from: "RS"

# Output filenames (inside out_dir)
countries_out: "country_shapes.geojson"
europe_out: "europe_shape.geojson"
reductions_out: "country_reductions.geojson"
